<text x="24" y="560" fill="#4ADE80" font-size="13">● Alle Geräte synchron</text>
<text x="248" y="96" fill="#E2E8F0" font-size="24" font-weight="700">Geräte</text><text x="248" y="122" fill="#94A3B8" font-size="14">Verbindungen laufen direkt zwischen Ihren Geräten (Peer-to-Peer, verschlüsselt)</text><rect x="248" y="150" width="688" height="56" rx="10" fill="#1E293B"/><rect x="264" y="164" width="28" height="28" rx="6" fill="#334155"/><text x="308" y="175" fill="#E2E8F0" font-size="15" font-weight="600">Heimserver (alter PC im Keller)</text><text x="308" y="194" fill="#94A3B8" font-size="13">Linux · immer eingeschaltet · 135 GB</text><text x="920" y="184" fill="#4ADE80" font-size="13" text-anchor="end">● online</text><rect x="248" y="218" width="688" height="56" rx="10" fill="#1E293B"/><rect x="264" y="232" width="28" height="28" rx="6" fill="#334155"/><text x="308" y="243" fill="#E2E8F0" font-size="15" font-weight="600">Laptop</text><text x="308" y="262" fill="#94A3B8" font-size="13">Windows 11 · zuletzt gesehen jetzt</text><text x="920" y="252" fill="#4ADE80" font-size="13" text-anchor="end">● online</text><rect x="248" y="286" width="688" height="56" rx="10" fill="#1E293B"/><rect x="264" y="300" width="28" height="28" rx="6" fill="#334155"/><text x="308" y="311" fill="#E2E8F0" font-size="15" font-weight="600">Tablet</text><text x="308" y="330" fill="#94A3B8" font-size="13">Android · zuletzt gesehen vor 3 Std.</text><text x="920" y="320" fill="#94A3B8" font-size="13" text-anchor="end">○ offline</text><rect x="248" y="372" width="688" height="178" rx="10" fill="#1E293B"/><text x="268" y="404" fill="#E2E8F0" font-size="15" font-weight="600">Neues Gerät verbinden</text><text x="268" y="430" fill="#94A3B8" font-size="14">Geben Sie diesen Code auf dem neuen Gerät ein:</text><rect x="268" y="446" width="300" height="52" rx="8" fill="#0F172A" stroke="#7CC4FA" stroke-width="2" stroke-dasharray="6 4"/><text x="418" y="480" fill="#E2E8F0" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="3">K7MQ-4XRT</text><text x="268" y="530" fill="#94A3B8" font-size="13">Der Code gilt 10 Minuten.</text>
</svg>