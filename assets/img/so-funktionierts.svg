<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="dt dd">
<title id="dt">So funktioniert Holvana</title>
<desc id="dd">Laptop, Smartphone und Tablet verbinden sich direkt miteinander und mit einem Heimserver, der immer eingeschaltet ist. Alle Geräte stehen in Ihrem Zuhause bzw. gehören Ihnen. Eine fremde Cloud wird nicht benötigt. KI-generierte Grafik (Claude, Anthropic).</desc>
<metadata id="ki-hinweis">KI-generiert: erstellt mit Claude (Anthropic) nach Vorgaben der Holvana GmbH, 2026. Fiktive Darstellung, kein echter Bildschirminhalt.</metadata>
<rect x="20" y="20" width="620" height="380" rx="18" fill="none" stroke="#7CC4FA" stroke-width="2" stroke-dasharray="8 6"/>
<text x="44" y="52" fill="#7CC4FA" font-size="15" font-weight="600">Ihre Geräte</text>
<g stroke="#7CC4FA" stroke-width="3" stroke-linecap="round">
<line x1="160" y1="138" x2="330" y2="250"/><line x1="500" y1="138" x2="330" y2="250"/><line x1="200" y1="105" x2="460" y2="105"/>
</g>
<rect x="60" y="70" width="200" height="78" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/><text x="160.0" y="104" fill="#E2E8F0" font-size="17" font-weight="600" text-anchor="middle">Laptop</text><text x="160.0" y="127" fill="#94A3B8" font-size="13" text-anchor="middle">Client</text>
<rect x="400" y="70" width="200" height="78" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/><text x="500.0" y="104" fill="#E2E8F0" font-size="17" font-weight="600" text-anchor="middle">Smartphone</text><text x="500.0" y="127" fill="#94A3B8" font-size="13" text-anchor="middle">Client</text>
<rect x="200" y="250" width="260" height="78" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/><text x="330.0" y="284" fill="#E2E8F0" font-size="17" font-weight="600" text-anchor="middle">Heimserver</text><text x="330.0" y="307" fill="#94A3B8" font-size="13" text-anchor="middle">immer eingeschalteter Peer</text>
<text x="330" y="98" fill="#94A3B8" font-size="13" text-anchor="middle">direkt (P2P)</text>
<text x="330" y="370" fill="#94A3B8" font-size="13" text-anchor="middle">verschlüsselte Verbindungen zwischen Ihren Geräten</text>
<rect x="680" y="150" width="180" height="110" rx="14" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
<text x="770" y="196" fill="#E2E8F0" font-size="16" font-weight="600" text-anchor="middle">Fremde Cloud</text>
<text x="770" y="222" fill="#F87171" font-size="14" text-anchor="middle">✕ nicht nötig</text>
<line x1="650" y1="205" x2="672" y2="205" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4"/>
<text x="860" y="410" fill="#94A3B8" font-size="12" text-anchor="end">KI-generiert · Claude (Anthropic)</text>
</svg>